spring.threads.virtual.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.web.resources.add-mappings=false
server.error.include-message=never
logging.level.ru.corelia=${CORELIA_LOG_LEVEL:INFO}
logging.pattern.level=%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.prometheus.metrics.export.enabled=true
corelia.tracing.enabled=${TRACING_ENABLED:true}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}
management.opentelemetry.tracing.export.otlp.transport=http
corelia.internal.tls-enabled=true
corelia.internal.key-store=${CORELIA_KEY_STORE:}
corelia.internal.trust-store=${CORELIA_TRUST_STORE:}
corelia.tls.password=${CORELIA_TLS_PASSWORD:}
corelia.internal.timeout-ms=60000
corelia.upstream.max-response-size-mb=${CORELIA_UPSTREAM_MAX_RESPONSE_SIZE_MB:10}
corelia.services.document=${CORELIA_DOCUMENT_URL:https://corelia-document-service:8443}
corelia.services.workflow=${CORELIA_WORKFLOW_URL:https://corelia-workflow-service:8443}
corelia.services.attachment=${CORELIA_ATTACHMENT_URL:https://corelia-attachment-service:8443}
corelia.services.data=${CORELIA_DATA_URL:https://corelia-data-service:8443}
